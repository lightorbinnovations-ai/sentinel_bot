name: The Void Sentinel

on:
  schedule:
    - cron: '*/15 * * * *' # Runs every 15 minutes
  workflow_dispatch: # Allows manual trigger

jobs:
  trade:
    runs-on: ubuntu-latest
    concurrency:
      group: void-sentinel-trading
      cancel-in-progress: false # We don't want to kill a live trade

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run The Void Sentinel
        env:
          DERIV_TOKEN: ${{ secrets.DERIV_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INITIAL_STAKE: ${{ vars.INITIAL_STAKE || '1.50' }}
          STOP_LOSS: ${{ vars.STOP_LOSS || '2.00' }}
          GHOST_THRESHOLD: ${{ vars.GHOST_THRESHOLD || '3' }}
          TAKE_PROFIT: ${{ vars.TAKE_PROFIT || '10.00' }}
        run: |
          # Run the bot for a maximum of 13 minutes to allow next cron to start clean
          # Use timeout to ensure it doesn't overlap or hang
          timeout 13m python sentinel.py || echo "Session timed out or completed."
