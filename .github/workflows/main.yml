name: The Void Sentinel

on:
  schedule:
    - cron: '*/15 * * * *' # Runs every 15 minutes
  workflow_dispatch: # Allows manual trigger

jobs:
  trade:
    runs-on: windows-latest
    concurrency:
      group: void-sentinel-trading
      cancel-in-progress: false # We don't want to kill a live trade

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies & Connectivity Diagnostic
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          echo "🌐 Testing connectivity to Global Clusters..."
          curl -v --connect-timeout 10 https://ws.binaryws.com/websockets/v3?app_id=1089

      - name: Run The Void Sentinel
        env:
          DERIV_TOKEN: ${{ secrets.DERIV_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INITIAL_STAKE: ${{ vars.INITIAL_STAKE || '1.50' }}
          STOP_LOSS: ${{ vars.STOP_LOSS || '2.00' }}
          GHOST_THRESHOLD: ${{ vars.GHOST_THRESHOLD || '3' }}
          TAKE_PROFIT: ${{ vars.TAKE_PROFIT || '10.00' }}
        run: |
          # Windows uses different timeout syntax
          # Using -u for unbuffered output
          python -u sentinel.py
